<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>ShopYard Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <h1 class="logo">
            ShopYard
        </h1>
        <div class="nav-right">
            <input
            type="text"
            id="search"
            placeholder="Search products...">
            <select id="category">
                <option value="all">
                    All Categories
                </option>
                <option value="electronics">
                    Electronics
                </option>
                <option value="jewelery">
                    Jewelery
                </option>
                <option value="men's clothing">
                    Men's Clothing
                </option>
                <option value="women's clothing">
                    Women's Clothing
                </option>
            </select>
            <button onclick="sortLowToHigh()">
                Price ↑
            </button>
            <button onclick="sortHighToLow()">
                Price ↓
            </button>
            <div class="cart-box">
                🛒 Cart :
                <span id="cart-count">0</span>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h2>
                Best Shopping Deals
            </h2>
            <p>
                Buy trending products at amazing prices
            </p>
        </div>
    </section>
    <p id="loader">
        Loading Products...
    </p>
    <p id="error"></p>
    <section id="products">
    </section>

    <section class="cart-section">
        <h2>
            Cart Items
        </h2>
        <div id="cart"></div>
        <h3>
            Total Price :
            ₹ <span id="total">0</span>
        </h3>
    </section>

    <script src="script.js"></script>

</body>
</html>
